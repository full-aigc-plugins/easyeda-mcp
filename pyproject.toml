[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyeda-mcp"
version = "0.1.0.dev2026101901"
description = "Workflow tools over the built-in EasyEDA / JLCEDA Pro MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
easyeda-mcp = "easyeda_mcp.server:main"

[tool.setuptools.packages.find]
include = ["easyeda_mcp*"]
